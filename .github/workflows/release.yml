name: Release

# A version tag, such as v0.6.0, builds the AppImage, the Windows zip, the macOS disk image and the per-platform
# Python wheels, and publishes them with a GitHub release of that tag; a tag with a suffix, such as v0.6.0-rc1,
# publishes a pre-release
on:
  push:
    tags:
      - 'v*'

jobs:
  appimage:
    runs-on: ubuntu-24.04
    # The oldest base the AppImage supports, the same one packaging/appimage/build.sh is tested in
    container: ubuntu:24.04
    steps:
      # git must exist before checkout, or the submodules are not fetched
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the AppImage
        run: packaging/appimage/build.sh

      - name: Keep the AppImage for the release
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: out/appimage/*.AppImage

  windows:
    # windows-latest is the Windows Server 2025 image with Visual Studio 2026, CMake and Ninja; every dependency
    # comes from its vendor submodule and the C++ runtime is linked statically, so the zip runs on any Windows 10
    # or newer
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Ninja looks for cl in the environment, which vcvarsall sets up
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # The install rules lay out the folder: the programs, the icon, the notices and the licenses
      - name: Build the zip
        run: |
          $Name = "siggen-$('${{ github.ref_name }}'.TrimStart('v'))-windows-x64"
          cmake --install build --prefix "out/zip/$Name"
          Compress-Archive "out/zip/$Name" "out/zip/$Name.zip"

      - name: Keep the zip for the release
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/zip/*.zip

  macos:
    # macos-26 is an Apple silicon image with Xcode 26, whose SDK the macOS 26 deployment target of the project
    # needs; the disk image is for Apple silicon
    runs-on: macos-26
    steps:
      - name: Install build tools
        run: brew install cmake ninja pkgconf

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the disk image
        run: packaging/macos/build.sh

      - name: Keep the disk image for the release
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/macos/*.dmg

  # The Python wheel of the library, one per platform, built in the same environments as the packs. It ships the
  # `siggen` package and the compiled `siggen_c` library it loads with ctypes; because that uses no CPython ABI,
  # each wheel is py3-none-<platform> and runs on any Python 3.10+.
  wheel-linux:
    # The same base as the AppImage: Ubuntu 24.04 (glibc 2.39), so auditwheel repairs the wheel to manylinux_2_39
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      # git must exist before checkout, or the submodules are not fetched
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential gcc-14 g++-14 cmake ninja-build pkg-config \
            python3 python3-pip python3-venv patchelf
          # GCC 14, the newest Ubuntu 24.04 offers; CMake looks for the plain names, so they point to it
          ln -sf /usr/bin/gcc-14 /usr/local/bin/gcc
          ln -sf /usr/bin/g++-14 /usr/local/bin/g++
          ln -sf /usr/bin/gcc-14 /usr/local/bin/cc
          ln -sf /usr/bin/g++-14 /usr/local/bin/c++

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # scikit-build-core (pinned in pyproject.toml) builds the wheel in an isolated environment
      - name: Build the wheel
        run: |
          python3 -m venv /tmp/buildenv
          /tmp/buildenv/bin/pip install --upgrade pip build auditwheel
          CC=gcc CXX=g++ /tmp/buildenv/bin/python -m build --wheel --outdir /tmp/wheelhouse

      # Bundles the C++ runtime and retargets the wheel to the manylinux base of the AppImage
      - name: Repair to manylinux
        run: /tmp/buildenv/bin/auditwheel repair /tmp/wheelhouse/*.whl --plat manylinux_2_39_x86_64 -w dist

      - name: Keep the wheel for the release
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  wheel-macos:
    # The same Apple silicon image as the disk image; MACOSX_DEPLOYMENT_TARGET matches the project's target so the
    # wheel is tagged macosx_26_0_arm64
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - name: Install build tools
        run: brew install cmake ninja

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the wheel
        run: |
          python3 -m venv /tmp/buildenv
          /tmp/buildenv/bin/pip install --upgrade pip build
          /tmp/buildenv/bin/python -m build --wheel --outdir dist

      - name: Keep the wheel for the release
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: dist/*.whl

  wheel-windows:
    # The same image as the zip; MSVC links the C++ runtime statically, so the wheel is self-contained and tagged
    # win_amd64
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Ninja looks for cl in the environment, which vcvarsall sets up
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist

      - name: Keep the wheel for the release
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl

  # One job publishes every file, so the release is created once
  publish:
    needs: [appimage, windows, macos, wheel-linux, wheel-macos, wheel-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The attestation signs with a Sigstore certificate from the workflow's OIDC token and stores the record
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Collect the AppImage, the zip, the disk image and the wheels
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Users check a download with sha256sum -c SHA256SUMS on Linux, certutil -hashfile <file> SHA256 on Windows,
      # or shasum -a 256 -c SHA256SUMS on macOS
      - name: Write the checksums
        working-directory: release
        run: sha256sum *.AppImage *.zip *.dmg *.whl > SHA256SUMS

      # Proves the files were built by this workflow from the tagged commit:
      # gh attestation verify <file> --repo ronnymilleo/siggen
      - name: Attest the build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.AppImage
            release/*.zip
            release/*.dmg
            release/*.whl

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          # A tag with a suffix, such as v0.6.0-rc1, is a test build and never becomes the latest release
          prerelease: ${{ contains(github.ref_name, '-') }}
